name: Wire password recovery
on:
  push:
    paths:
      - '.github/workflows/wire-password-recovery.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register password recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          marker='from reports import register_reports\n'
          insert='from password_recovery import register_password_recovery\nregister_password_recovery(app,db)\n'
          if insert not in s:
              if marker not in s:
                  raise SystemExit('registration marker not found')
              s=s.replace(marker,insert+marker,1)
              p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Register secure password recovery routes"
          git push
