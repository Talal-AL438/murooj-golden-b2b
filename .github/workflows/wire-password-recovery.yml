name: Extend portal settings
on:
  push:
    paths:
      - '.github/workflows/wire-password-recovery.yml'
permissions:
  contents: write
jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend settings persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          old='{"company_name":"مروج الذهبية للاستثمار","brand":"MUROOJ GOLDEN","whatsapp":"966550558014","email":"talal_alaqely@icloud.com","announcement":"","announcement_active":"0"}'
          new='{"company_name":"مروج الذهبية للاستثمار","brand":"MUROOJ GOLDEN","whatsapp":"966550558014","email":"talal_alaqely@icloud.com","mail_sender_name":"MUROOJ GOLDEN","mail_sender_email":"","announcement":"","announcement_active":"0","announcement_target":"all","announcement_start":"","announcement_end":"","announcement_whatsapp":"0"}'
          if old in s:
              s=s.replace(old,new,1)
          old_loop='for key in ("company_name","brand","whatsapp","email","announcement","announcement_active"):\n            if key in request.form:c.execute("INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value",(key,request.form[key]))'
          new_loop='for key in ("company_name","brand","whatsapp","email","mail_sender_name","mail_sender_email","announcement","announcement_target","announcement_start","announcement_end"):\n            if key in request.form:c.execute("INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value",(key,request.form[key]))\n        for key in ("announcement_active","announcement_whatsapp"):\n            value="1" if request.form.get(key) else "0"\n            c.execute("INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value",(key,value))'
          if old_loop not in s:
              raise SystemExit('settings persistence marker not found')
          s=s.replace(old_loop,new_loop,1)
          p.write_text(s)
          PY
      - name: Commit settings wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Persist mail and announcement settings"
          git push
