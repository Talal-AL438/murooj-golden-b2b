name: Register reports module
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register reports routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          marker='@app.route("/health")'
          block='from reports import register_reports\nregister_reports(app,admin_required,db,current_user)\n\n'
          if 'register_reports(app,admin_required,db,current_user)' not in s:
              if marker not in s:
                  raise SystemExit('health marker not found')
              p.write_text(s.replace(marker,block+marker,1))
          PY
      - name: Commit registration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Register professional reports routes"
          git push
