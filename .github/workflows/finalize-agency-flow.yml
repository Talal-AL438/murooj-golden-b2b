name: Finalize agency browsing flow
on:
  push:
    paths:
      - '.github/workflows/finalize-agency-flow.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update portal flow safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          old='''    return {"T":t(),"lang":session.get("lang","ar"),"unread_count":unread_count}'''
          new='''    c=db();portal_settings={r["key"]:r["value"] for r in c.execute("SELECT * FROM settings").fetchall()};c.close()\n    return {"T":t(),"lang":session.get("lang","ar"),"unread_count":unread_count,"portal_settings":portal_settings}'''
          assert old in s
          s=s.replace(old,new,1)
          old='''session["user_id"]=uid;session["lang"]=request.form.get("language","ar");return redirect(url_for("account"))'''
          new='''session["user_id"]=uid;session["lang"]=request.form.get("language","ar");return redirect(url_for("home", _anchor="hotels"))'''
          assert old in s
          s=s.replace(old,new,1)
          old='''if u and u["active"] and check_password_hash(u["password_hash"],request.form["password"]):session["user_id"]=u["id"];session["lang"]=u["language"] or "ar";return redirect(url_for("admin" if u["role"] in ("super_admin","staff") else "account"))\n        flash("Invalid login or suspended account.")'''
          new='''if u and u["active"] and check_password_hash(u["password_hash"],request.form["password"]):\n            session["user_id"]=u["id"];session["lang"]=u["language"] or "ar"\n            return redirect(url_for("admin") if u["role"] in ("super_admin","staff") else url_for("home", _anchor="hotels"))\n        login_messages={"ar":"البريد الإلكتروني أو كلمة المرور غير صحيحة، أو الحساب غير نشط.","en":"Email or password is incorrect, or the account is inactive.","id":"Email atau kata sandi salah, atau akun tidak aktif.","ms":"E-mel atau kata laluan tidak betul, atau akaun tidak aktif."}\n        flash(login_messages.get(session.get("lang","ar"),login_messages["ar"]))'''
          assert old in s
          s=s.replace(old,new,1)
          marker='''@app.route("/health")\ndef health():return jsonify({"ok":True})'''
          replacement='''@app.route("/robots.txt")\ndef robots_txt():return app.send_static_file("robots.txt")\n\n@app.route("/health")\ndef health():return jsonify({"ok":True})'''
          assert marker in s
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
          python -m py_compile app.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Complete agency hotel-first flow and shared settings'
          git push origin main
