{% extends 'base.html' %}
{% block body %}
<main class="page-shell">
  <section class="page-intro">
    <span class="eyebrow">MUROOJ GOLDEN B2B</span>
    <h1>{{ T.quick_request }}</h1>
    <p>{{ T.success_request.split('.')[0] if T.success_request else '' }}</p>
  </section>

  <form method="post" class="card form" id="quick-request-form">
    <div class="form-grid">
      <label>{{ T.city }}
        <select name="city" id="request-city" required>
          <option value="Makkah" selected>{{ T.makkah }}</option>
          <option value="Madinah">{{ T.madinah }}</option>
        </select>
      </label>

      <label>{{ T.hotel }}
        <select name="hotel_id" id="request-hotel" required>
          <option value="any">{{ T.any_hotel }}</option>
          {% for h in hotels %}
          <option value="{{ h.id }}" data-city="{{ h.city }}" {{ 'selected' if request.args.get('hotel') == h.id|string }}>
            {{ h.name_ar }} / {{ h.name_en }}
          </option>
          {% endfor %}
        </select>
      </label>

      <label>{{ T.checkin }}
        <input type="date" name="checkin" id="checkin" required>
      </label>

      <label>{{ T.checkout }}
        <input type="date" name="checkout" id="checkout" required>
      </label>

      <label>{{ T.rooms }}
        <input type="number" min="1" step="1" name="rooms" inputmode="numeric" required>
      </label>

      <label>{{ T.persons }}
        <input type="number" min="1" step="1" name="persons" inputmode="numeric" required>
      </label>

      <label>{{ T.nationality }}
        <input name="nationality" autocomplete="country-name" required>
      </label>

      <label>{{ T.meal }}
        <select name="meal" required>
          <option value="RO">{{ T.room_only }}</option>
          <option value="F.B Indo">{{ T.indo_fb }}</option>
          <option value="F.B Malaysian">{{ T.malay_fb }}</option>
        </select>
      </label>
    </div>

    <label class="full">{{ T.notes }}
      <textarea name="notes" rows="5"></textarea>
    </label>

    <div class="request-note">{{ T.meal }}: {{ T.persons }}</div>
    <button class="btn gold" type="submit">{{ T.submit }}</button>
  </form>
</main>

<script>
(function () {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const minDate = `${yyyy}-${mm}-${dd}`;
  const checkin = document.getElementById('checkin');
  const checkout = document.getElementById('checkout');
  checkin.min = minDate;
  checkout.min = minDate;
  checkin.addEventListener('change', function () {
    checkout.min = this.value || minDate;
    if (checkout.value && checkout.value < checkout.min) checkout.value = '';
  });

  const city = document.getElementById('request-city');
  const hotel = document.getElementById('request-hotel');
  function syncHotels() {
    const selectedCity = city.value;
    let selectedVisible = hotel.value === 'any';
    Array.from(hotel.options).forEach(function (option) {
      if (option.value === 'any') return;
      const visible = option.dataset.city === selectedCity;
      option.hidden = !visible;
      option.disabled = !visible;
      if (visible && option.selected) selectedVisible = true;
    });
    if (!selectedVisible) hotel.value = 'any';
  }
  city.addEventListener('change', syncHotels);
  const selectedOption = hotel.options[hotel.selectedIndex];
  if (selectedOption && selectedOption.dataset.city) city.value = selectedOption.dataset.city;
  syncHotels();
})();
</script>
{% endblock %}
