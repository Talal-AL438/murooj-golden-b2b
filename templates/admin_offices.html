{% extends 'base.html' %}{% block body %}<main class="page-shell"><div class="section-head"><div><span class="eyebrow">MUROOJ GOLDEN</span><h1>مكاتب وفروع مروج الذهبية</h1></div></div><section class="card form"><h2>إضافة مكتب</h2><form method="post"><input type="hidden" name="action" value="add"><div class="form-grid"><label>اسم المكتب بالعربي<input name="name_ar" required></label><label>English name<input name="name_en"></label><label>المدينة<input name="city"></label><label>العنوان<input name="address"></label><label>الجوال<input name="phone"></label><label>البريد<input type="email" name="email"></label><label>الموقع الرسمي<input type="url" name="website_url"></label><label>رابط الخريطة<input type="url" name="map_url"></label><label>ساعات العمل<input name="hours"></label><label>الترتيب<input type="number" name="sort_order" value="0"></label></div><button class="btn gold">إضافة</button></form></section><div class="grid" style="margin-top:22px">{% for o in offices %}<article class="card"><h3>{{o.name_ar}}</h3><p>{{o.city}} · {{o.address}}<br>{{o.phone}} · {{o.email}}</p>{% if o.website_url %}<a class="btn small outline" href="{{o.website_url}}" target="_blank" rel="noopener">الموقع الرسمي</a>{% endif %}<form method="post" style="margin-top:10px"><input type="hidden" name="action" value="toggle"><input type="hidden" name="oid" value="{{o.id}}"><button class="btn small dark">{{'إخفاء' if o.active else 'إظهار'}}</button></form></article>{% endfor %}</div></main>{% endblock %}
