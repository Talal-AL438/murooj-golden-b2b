{% extends 'base.html' %}{% block body %}<main><div class="adminnav"><a href="{{url_for('admin')}}">{{T.admin}}</a><a href="{{url_for('admin_hotels')}}">{{T.hotels}}</a><a href="{{url_for('admin_offers')}}">{{T.offers}}</a></div><h1>{{T.hotels}}</h1><form method="post" class="card form"><input name="name_ar" placeholder="الاسم العربي" required><input name="name_en" placeholder="English name" required><select name="city"><option>Makkah</option><option>Madinah</option></select><input name="map_url" placeholder="Google Maps URL"><input class="full" name="services" placeholder="Service 1|Service 2|Service 3"><input name="meals" value="RO|F.B Indo|F.B Malaysian"><input type="number" name="sort_order" value="0"><button class="btn gold">{{T.add}}</button></form><div class="tablewrap"><table><tr><th>{{T.hotel}}</th><th>{{T.city}}</th><th>{{T.status}}</th><th>{{T.actions}}</th></tr>{% for h in hotels %}<tr><td>{{h.name_ar}}<br><span translate="no">{{h.name_en}}</span></td><td>{{h.city}}</td><td>{{T.active if h.active else T.hide}}</td><td><form class="inline" method="post" action="{{url_for('hotel_toggle',hid=h.id)}}"><button class="btn small dark">{{T.hide if h.active else T.show}}</button></form></td></tr>{% endfor %}</table></div></main>{% endblock %}
