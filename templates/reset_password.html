{% extends 'base.html' %}{% block body %}
<main><h1>{{ {'ar':'إنشاء كلمة مرور جديدة','en':'Create a new password','id':'Buat kata sandi baru','ms':'Cipta kata laluan baharu'}[session.get('lang','ar')] }}</h1>
<form method="post" class="card form narrow">
<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
<label>{{ {'ar':'كلمة المرور الجديدة','en':'New password','id':'Kata sandi baru','ms':'Kata laluan baharu'}[session.get('lang','ar')] }}<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
<label>{{ {'ar':'تأكيد كلمة المرور','en':'Confirm password','id':'Konfirmasi kata sandi','ms':'Sahkan kata laluan'}[session.get('lang','ar')] }}<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label>
<button class="btn gold">{{ {'ar':'حفظ كلمة المرور','en':'Save password','id':'Simpan kata sandi','ms':'Simpan kata laluan'}[session.get('lang','ar')] }}</button>
</form></main>{% endblock %}
